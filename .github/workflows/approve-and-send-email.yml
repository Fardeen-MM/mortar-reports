name: Approve and Send Email

on:
  workflow_dispatch:
    inputs:
      firm_name:
        description: 'Firm Name'
        required: true
      lead_email:
        description: 'Lead Email'
        required: true
      report_url:
        description: 'Report URL'
        required: true
      contact_name:
        description: 'Contact Name'
        required: true
  repository_dispatch:
    types: [send_approved_email]

jobs:
  send-approved-email:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        working-directory: ./automation
        
      - name: Extract inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          # workflow_dispatch inputs
          WD_FIRM_NAME: ${{ github.event.inputs.firm_name }}
          WD_LEAD_EMAIL: ${{ github.event.inputs.lead_email }}
          WD_CONTACT_NAME: ${{ github.event.inputs.contact_name }}
          WD_REPORT_URL: ${{ github.event.inputs.report_url }}
          # repository_dispatch payload
          RD_FIRM_NAME: ${{ github.event.client_payload.firm_name }}
          RD_FIRM_FOLDER: ${{ github.event.client_payload.firm_folder }}
          RD_LEAD_EMAIL: ${{ github.event.client_payload.lead_email }}
          RD_CONTACT_NAME: ${{ github.event.client_payload.contact_name }}
          RD_REPORT_URL: ${{ github.event.client_payload.report_url }}
          RD_TOTAL_RANGE: ${{ github.event.client_payload.total_range }}
          RD_TOTAL_CASES: ${{ github.event.client_payload.total_cases }}
          RD_PRACTICE_LABEL: ${{ github.event.client_payload.practice_label }}
          RD_COUNTRY: ${{ github.event.client_payload.country }}
          RD_SKIP_EMAIL: ${{ github.event.client_payload.skip_email }}
          RD_CLASSIFICATION: ${{ github.event.client_payload.classification }}
        run: |
          # Handle both workflow_dispatch and repository_dispatch
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "firm_name=$WD_FIRM_NAME" >> $GITHUB_OUTPUT
            echo "lead_email=$WD_LEAD_EMAIL" >> $GITHUB_OUTPUT
            echo "contact_name=$WD_CONTACT_NAME" >> $GITHUB_OUTPUT
            echo "report_url=$WD_REPORT_URL" >> $GITHUB_OUTPUT
            echo "firm_folder=" >> $GITHUB_OUTPUT
            echo "total_range=" >> $GITHUB_OUTPUT
            echo "total_cases=" >> $GITHUB_OUTPUT
            echo "practice_label=" >> $GITHUB_OUTPUT
            echo "country=" >> $GITHUB_OUTPUT
            echo "skip_email=" >> $GITHUB_OUTPUT
            echo "classification=INTERESTED" >> $GITHUB_OUTPUT
          else
            # repository_dispatch (from Telegram webhook)
            echo "firm_name=$RD_FIRM_NAME" >> $GITHUB_OUTPUT
            echo "firm_folder=$RD_FIRM_FOLDER" >> $GITHUB_OUTPUT
            echo "lead_email=$RD_LEAD_EMAIL" >> $GITHUB_OUTPUT
            echo "contact_name=$RD_CONTACT_NAME" >> $GITHUB_OUTPUT
            echo "report_url=$RD_REPORT_URL" >> $GITHUB_OUTPUT
            echo "total_range=$RD_TOTAL_RANGE" >> $GITHUB_OUTPUT
            echo "total_cases=$RD_TOTAL_CASES" >> $GITHUB_OUTPUT
            echo "practice_label=$RD_PRACTICE_LABEL" >> $GITHUB_OUTPUT
            echo "country=$RD_COUNTRY" >> $GITHUB_OUTPUT
            echo "skip_email=$RD_SKIP_EMAIL" >> $GITHUB_OUTPUT
            echo "classification=$RD_CLASSIFICATION" >> $GITHUB_OUTPUT
          fi
      
      - name: Deploy report from pending to live
        id: deploy
        run: |
          FIRM_NAME="${{ steps.inputs.outputs.firm_name }}"
          INPUT_FIRM_FOLDER="${{ steps.inputs.outputs.firm_folder }}"

          # Use firm_folder if provided, otherwise generate from firm name
          if [ -n "$INPUT_FIRM_FOLDER" ]; then
            FIRM_FOLDER="$INPUT_FIRM_FOLDER"
            echo "Using provided firm_folder: $FIRM_FOLDER"
          else
            # Generate folder name from firm name (same logic as process workflow)
            FIRM_FOLDER=$(FIRM_NAME_INPUT="$FIRM_NAME" node -e "
              const name = process.env.FIRM_NAME_INPUT || '';
              const clean = name
                .replace(/[^a-zA-Z0-9\\s&]/g, '')
                .split(/\\s+/)
                .filter(w => w.length > 0)
                .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
                .join('');
              console.log(clean || 'UnknownFirm');
            ")
            echo "Generated firm_folder: $FIRM_FOLDER"
          fi

          echo "firm_folder=$FIRM_FOLDER" >> $GITHUB_OUTPUT

          # Live URL (after moving from pending)
          LIVE_URL="https://reports.mortarmetrics.com/$FIRM_FOLDER/"
          echo "live_report_url=$LIVE_URL" >> $GITHUB_OUTPUT

          # Check if pending report exists
          if [ -f "pending-reports/$FIRM_FOLDER/index.html" ]; then
            echo "📂 Moving report from pending-reports/$FIRM_FOLDER to $FIRM_FOLDER (LIVE)"
            mkdir -p "$FIRM_FOLDER"
            mv "pending-reports/$FIRM_FOLDER/index.html" "$FIRM_FOLDER/index.html"
            rmdir "pending-reports/$FIRM_FOLDER" 2>/dev/null || true

            # Update approval status
            if [ -f "automation/pending-approvals/$FIRM_FOLDER.json" ]; then
              # Update status to approved
              FIRM_FOLDER_ENV="$FIRM_FOLDER" node -e "
                const fs = require('fs');
                const file = 'automation/pending-approvals/' + process.env.FIRM_FOLDER_ENV + '.json';
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                data.status = 'approved';
                data.approved_at = new Date().toISOString();
                fs.writeFileSync(file, JSON.stringify(data, null, 2));
              "
            fi
          else
            echo "❌ ERROR: No pending report found at pending-reports/$FIRM_FOLDER"
            echo "   Cannot proceed without report to deploy"
            # Check if live report exists already
            if [ -f "$FIRM_FOLDER/index.html" ]; then
              echo "   Live report already exists - continuing with email"
            else
              echo "   No live report either - aborting"
              exit 1
            fi
          fi

      - name: Commit and push live report
        run: |
          FIRM_FOLDER="${{ steps.deploy.outputs.firm_folder }}"
          git config user.name "Mortar Metrics Bot"
          git config user.email "automation@mortarmetrics.com"

          git add "$FIRM_FOLDER/" 2>/dev/null || true
          git add "automation/pending-approvals/$FIRM_FOLDER.json" 2>/dev/null || true
          git add "pending-reports/" 2>/dev/null || true
          git commit -m "Deploy approved report for $FIRM_FOLDER" || echo "No changes to commit"

          # Push with conflict-resilient retry
          git push origin main || {
            echo "Push failed, pulling latest and retrying..."
            cp "$FIRM_FOLDER/index.html" /tmp/live-report.html 2>/dev/null || true
            git reset HEAD~1
            git checkout -- . 2>/dev/null || true
            rm -rf "$FIRM_FOLDER/" 2>/dev/null || true
            git pull origin main
            if [ -f "$FIRM_FOLDER/index.html" ]; then
              echo "✅ Report already deployed by parallel run — nothing to do"
            else
              mkdir -p "$FIRM_FOLDER"
              cp /tmp/live-report.html "$FIRM_FOLDER/index.html"
              git add "$FIRM_FOLDER/" "automation/pending-approvals/" "pending-reports/" 2>/dev/null || true
              git diff --cached --quiet || {
                git commit -m "Deploy approved report for $FIRM_FOLDER"
                git push origin main || echo "⚠️ Push failed — report may already exist"
              }
            fi
          }

      - name: Fetch custom email body (if edited)
        id: custom_email
        if: startsWith(steps.inputs.outputs.skip_email, 'custom:')
        env:
          SKIP_EMAIL: ${{ steps.inputs.outputs.skip_email }}
        run: |
          # Extract approvalId from "custom:{approvalId}"
          APPROVAL_ID="${SKIP_EMAIL#custom:}"
          export APPROVAL_ID
          echo "📝 Fetching custom email for approval ID: $APPROVAL_ID"

          ENCODED_ID=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ.get('APPROVAL_ID','')))")
          CUSTOM_BODY=$(curl -sf "https://instantly-webhook-proxy.fardeen-729.workers.dev/custom-email/$ENCODED_ID" || echo "")

          if [ -z "$CUSTOM_BODY" ]; then
            echo "❌ Custom email body not found or expired"
            exit 1
          fi

          echo "✅ Custom email body fetched (${#CUSTOM_BODY} chars)"
          # Write to temp file to preserve newlines
          echo "$CUSTOM_BODY" > /tmp/custom-email-body.txt
          echo "has_custom=true" >> $GITHUB_OUTPUT

      - name: Store lead metadata in Worker KV
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          FIRM_FOLDER: ${{ steps.deploy.outputs.firm_folder }}
          FIRM_NAME: ${{ steps.inputs.outputs.firm_name }}
          LEAD_EMAIL: ${{ steps.inputs.outputs.lead_email }}
          CONTACT_NAME: ${{ steps.inputs.outputs.contact_name }}
          PRACTICE_LABEL: ${{ steps.inputs.outputs.practice_label }}
          COUNTRY: ${{ steps.inputs.outputs.country }}
        run: |
          LIVE_URL="${{ steps.deploy.outputs.live_report_url }}"
          WORKER="${WORKER_URL:-https://instantly-webhook-proxy.fardeen-729.workers.dev}"
          echo "📡 Storing lead metadata for $FIRM_FOLDER in Worker KV..."

          REPORT_URL_ENV="$LIVE_URL" node -e "
            console.log(JSON.stringify({
              email: process.env.LEAD_EMAIL,
              firm_name: process.env.FIRM_NAME,
              contact_name: process.env.CONTACT_NAME,
              report_url: process.env.REPORT_URL_ENV,
              practice_label: process.env.PRACTICE_LABEL,
              country: process.env.COUNTRY,
              firm_folder: process.env.FIRM_FOLDER
            }));
          " | curl -sf -X POST "$WORKER/store-lead" \
            -H "Content-Type: application/json" \
            -d @- && echo "✅ Lead metadata stored" || echo "⚠️ Failed to store lead metadata (non-critical)"

      - name: Send approved email
        if: steps.inputs.outputs.skip_email != 'true'
        env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC }}
          LEAD_EMAIL: ${{ steps.inputs.outputs.lead_email }}
          CONTACT_NAME: ${{ steps.inputs.outputs.contact_name }}
          FIRM_NAME: ${{ steps.inputs.outputs.firm_name }}
          TOTAL_RANGE: ${{ steps.inputs.outputs.total_range }}
          TOTAL_CASES: ${{ steps.inputs.outputs.total_cases }}
          PRACTICE_LABEL: ${{ steps.inputs.outputs.practice_label }}
          COUNTRY: ${{ steps.inputs.outputs.country }}
          DRY_RUN: 'false'
          REPLY_CLASSIFICATION: ${{ steps.inputs.outputs.classification }}
        run: |
          LIVE_URL="${{ steps.deploy.outputs.live_report_url }}"
          echo "📧 Sending approved email to $LEAD_EMAIL"
          echo "🏢 Firm: $FIRM_NAME"
          echo "🔗 Report: $LIVE_URL"
          echo "📊 Range: $TOTAL_RANGE | Cases: $TOTAL_CASES | Practice: $PRACTICE_LABEL"
          echo "🌍 Country: $COUNTRY"

          # Load custom email body if available
          if [ -f /tmp/custom-email-body.txt ]; then
            export CUSTOM_EMAIL_BODY=$(cat /tmp/custom-email-body.txt)
            echo "📝 Using custom email body (${#CUSTOM_EMAIL_BODY} chars)"
          fi

          node send-email.js \
            "$LEAD_EMAIL" \
            "$CONTACT_NAME" \
            "$LIVE_URL" \
            "" \
            "$FIRM_NAME" \
            "" \
            "$TOTAL_RANGE" \
            "$TOTAL_CASES" \
            "$PRACTICE_LABEL" \
            "$COUNTRY"
        working-directory: ./automation

      - name: Extract report data for nurture emails
        id: report_data
        run: |
          FIRM_FOLDER="${{ steps.deploy.outputs.firm_folder }}"
          REPORT_FILE="$FIRM_FOLDER/index.html"

          if [ ! -f "$REPORT_FILE" ]; then
            echo "⚠️ No report file found, using defaults"
            echo "city=" >> $GITHUB_OUTPUT
            echo "top_competitor=" >> $GITHUB_OUTPUT
            echo "competitor_reviews=" >> $GITHUB_OUTPUT
            echo "biggest_gap=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract city, competitor, reviews, and biggest gap from report HTML
          REPORT_FILE_ENV="$REPORT_FILE" node -e "
            const fs = require('fs');
            const html = fs.readFileSync(process.env.REPORT_FILE_ENV, 'utf8');

            // City from hero setup heading
            const cityMatch = html.match(/Every (?:30 days|month), people in ([^<]+?) search/i);
            const city = cityMatch ? cityMatch[1].trim() : '';
            console.log('city=' + city);

            // Competitors from table (rows without 'competitor-table-you' class)
            const tableMatch = html.match(/<div class=\"competitor-table\">[\\s\\S]*?<\\/table>/);
            let topComp = '', compReviews = '';
            if (tableMatch) {
              const rows = tableMatch[0].match(/<tr(?! class=\"competitor-table-you\")>([\\s\\S]*?)<\\/tr>/g) || [];
              if (rows.length > 0) {
                const nameMatch = rows[0].match(/<td>([^<]+)<\\/td>/);
                topComp = nameMatch ? nameMatch[1].trim() : '';
                // Try to get review count from review bars section
                const reviewPattern = new RegExp(topComp.replace(/[.*+?^\${}()|[\\]\\\\]/g, '\\\\\\$&') + '[\\\\s\\\\S]*?(\\\\d+)\\\\s*reviews', 'i');
                const revMatch = html.match(reviewPattern);
                compReviews = revMatch ? revMatch[1] : '';
              }
            }
            console.log('top_competitor=' + topComp);
            console.log('competitor_reviews=' + compReviews);

            // Biggest gap from revenue cards
            const gapCards = html.match(/<div class=\"revenue-card[^\"]*\">[\\s\\S]*?<div class=\"revenue-card-number\">([^<]+)<\\/div>/g) || [];
            const gaps = gapCards.map((card, i) => {
              const numMatch = card.match(/revenue-card-number\">([^<]+)/);
              const val = numMatch ? numMatch[1].replace(/[^0-9]/g, '') : '0';
              const labelMatch = card.match(/revenue-card-badge\">([^<]+)/);
              const label = labelMatch ? labelMatch[1].trim() : ['Search visibility', 'Social advertising', 'After-hours intake'][i];
              return { label, val: parseInt(val) || 0 };
            });
            const biggest = gaps.sort((a, b) => b.val - a.val)[0];
            const biggestGap = biggest ? biggest.label.toLowerCase() : '';
            console.log('biggest_gap=' + biggestGap);
          " >> $GITHUB_OUTPUT

      - name: Add lead to nurture queue
        if: steps.inputs.outputs.skip_email != 'true'
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          LEAD_EMAIL: ${{ steps.inputs.outputs.lead_email }}
          FIRM_NAME: ${{ steps.inputs.outputs.firm_name }}
          CONTACT_NAME: ${{ steps.inputs.outputs.contact_name }}
          PRACTICE_LABEL: ${{ steps.inputs.outputs.practice_label }}
          COUNTRY: ${{ steps.inputs.outputs.country }}
          TOTAL_RANGE: ${{ steps.inputs.outputs.total_range }}
          TOTAL_CASES: ${{ steps.inputs.outputs.total_cases }}
          CITY: ${{ steps.report_data.outputs.city }}
          TOP_COMPETITOR: ${{ steps.report_data.outputs.top_competitor }}
          COMPETITOR_REVIEWS: ${{ steps.report_data.outputs.competitor_reviews }}
          BIGGEST_GAP: ${{ steps.report_data.outputs.biggest_gap }}
        run: |
          LIVE_URL="${{ steps.deploy.outputs.live_report_url }}"
          WORKER="${WORKER_URL:-https://instantly-webhook-proxy.fardeen-729.workers.dev}"
          echo "📬 Adding $LEAD_EMAIL to nurture queue..."
          echo "   City: $CITY | Competitor: $TOP_COMPETITOR ($COMPETITOR_REVIEWS reviews) | Gap: $BIGGEST_GAP"

          REPORT_URL_ENV="$LIVE_URL" START_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" node -e "
            console.log(JSON.stringify({
              action: 'set',
              email: process.env.LEAD_EMAIL,
              data: {
                firm_name: process.env.FIRM_NAME,
                contact_name: process.env.CONTACT_NAME,
                report_url: process.env.REPORT_URL_ENV,
                practice_label: process.env.PRACTICE_LABEL,
                country: process.env.COUNTRY,
                total_range: process.env.TOTAL_RANGE,
                total_cases: process.env.TOTAL_CASES,
                city: process.env.CITY,
                top_competitor: process.env.TOP_COMPETITOR,
                competitor_reviews: process.env.COMPETITOR_REVIEWS,
                biggest_gap: process.env.BIGGEST_GAP,
                start_date: process.env.START_DATE,
                emails_sent: 0,
                last_sent: '',
                status: 'active'
              }
            }));
          " | curl -sf -X POST "$WORKER/nurture-check" \
            -H "Content-Type: application/json" \
            -d @- && echo "✅ Added to nurture queue" || echo "⚠️ Failed to add to nurture queue (non-critical)"
