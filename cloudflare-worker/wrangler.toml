name = "instantly-webhook-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Deploy with: wrangler deploy
#
# This worker handles Instantly webhooks, Telegram callbacks, report view tracking,
# email queue with Telegram approval, AI reply classification, and nurture sequences.
#
# Required secrets: GITHUB_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Optional secrets: INSTANTLY_API_KEY, ANTHROPIC_API_KEY, PROSP_API_KEY, PROSP_SENDER, PROSP_CAMPAIGN_ID
#
# For Telegram webhook handler, see wrangler-telegram.toml

[[kv_namespaces]]
binding = "WEBHOOK_KV"
id = "cf35f880d2f9444f8519400af63eb03e"
